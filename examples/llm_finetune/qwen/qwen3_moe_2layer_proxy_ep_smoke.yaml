# Small single-node expert-parallel smoke:
#   automodel examples/llm_finetune/qwen/qwen3_moe_2layer_proxy_ep_smoke.yaml --nproc-per-node 2

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 2
  local_batch_size: 1
  ckpt_every_steps: 1000
  val_every_steps: null
  num_epochs: 1
  max_steps: 2

dist_env:
  backend: nccl
  timeout_minutes: 5

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: transformers.models.qwen3_moe.configuration_qwen3_moe.Qwen3MoeConfig
    architectures: [Qwen3MoeForCausalLM]
    vocab_size: 4096
    hidden_size: 2048
    intermediate_size: 1024
    moe_intermediate_size: 1024
    num_hidden_layers: 2
    num_attention_heads: 8
    num_key_value_heads: 4
    max_position_embeddings: 256
    hidden_act: silu
    rms_norm_eps: 1.0e-6
    rope_theta: 100000.0
    num_experts: 4
    num_experts_per_tok: 2
    decoder_sparse_step: 1
    mlp_only_layers: []
    router_aux_loss_coef: 0.0
    norm_topk_prob: false
    initializer_range: 0.02
    bos_token_id: 1
    eos_token_id: 2
    pad_token_id: 0
    use_cache: false
  trust_remote_code: true
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: sdpa
    linear: torch
    rms_norm: torch_fp32
    experts: torch
    dispatcher: torch
    fake_balanced_gate: true
    enable_hf_state_dict_adapter: false

checkpoint:
  enabled: false
  checkpoint_dir: /tmp/qwen3_moe_ep_smoke

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 2
  sequence_parallel: false
  activation_checkpointing: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDataset
  vocab_size: 4096
  seq_len: 128
  num_samples: 16
  batch_size: 1

dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: null
  num_workers: 0

optimizer:
  _target_: torch.optim.Adam
  betas: [0.9, 0.95]
  eps: 1e-7
  lr: 5.0e-4
  weight_decay: 0.0

ci:
  recipe_owner: pst2154
  local_batch_size: 1
  time: "00:10:00"
